services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "timezone=${APP_TIMEZONE:-Asia/Tbilisi}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-furniture_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      TZ: ${APP_TIMEZONE:-Asia/Tbilisi}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-furniture_inventory}",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-furniture_inventory}
      PGUSER: ${POSTGRES_USER:-inventory}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      UPLOAD_DIR: /app/uploads
      PORT: 4000
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tbilisi}
      TZ: ${APP_TIMEZONE:-Asia/Tbilisi}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      MIGRATIONS_DIR: /app/migrations
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 15s
    ports:
      - "${BACKEND_PORT:-4000}:4000"
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-furniture_inventory}
      PGUSER: ${POSTGRES_USER:-inventory}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      TZ: ${APP_TIMEZONE:-Asia/Tbilisi}
      BACKUP_ROOT: /backups
      UPLOAD_ROOT: /uploads
      CHECK_INTERVAL_SECONDS: ${BACKUP_CHECK_INTERVAL_SECONDS:-3600}
    volumes:
      - ./data/backups:/backups
      - ./data/uploads:/uploads:ro
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/scripts/backup.sh", "daemon"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${FRONTEND_PORT:-3000}:80"
